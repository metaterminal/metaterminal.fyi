{% extends "base.html" %}

{% block head %}
<style>
  body {
    font-family: Hack;
    line-height: 1.5;
  }
  main {
    text-align: left;
    width: 100%;
  }
  header {
    margin-bottom: 1.5rem;
  }
  h1 {
    margin-top: 3rem;
    margin-bottom: .5rem;
  }
</style>
{% endblock head %}

{% block header %}
  <h1>Tags</h1>
{% endblock header %}

{% block content %}
<main>
  <p>There are {{ terms | length }} tags in total.</p>
    {% for tag in terms %}
    <div style="text-align: center;">
    <a href="{{ get_taxonomy_url(kind='tags', name=tag.name) }}">{{tag.name}}</a> - {{ tag.pages | length }}
    </div>
    {% endfor %}
</main>
{% endblock content %}
